version: '3.8'

services:
  db:
    image: postgres:13
    container_name: wallet-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    networks:
      - wallet-net

volumes:
  wallet_db_data:

networks:
  wallet-net:
    driver: bridge
